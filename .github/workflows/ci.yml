name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Unit tests
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: swift test

      - name: Bundle the app
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: Scripts/bundle-app.sh release
